<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhytoGuard-Pi</title>
  <style>
    body {
      background-color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #4CAF50;
      font-size: 2.5em;
      margin-bottom: 40px;
    }
    .btn {
      width: 300px;
      height: 100px;
      font-size: 1.8em;
      margin: 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-green {
      background-color: #4CAF50;
      color: white;
    }
    .btn-blue {
      background-color: #2196F3;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🌱 PhytoGuard-Pi</h1>
  <button class="btn btn-green"> Lancer Diagnostic</button>
  <button class="btn btn-blue"> Voir Historique</button>
</body>
</html>
